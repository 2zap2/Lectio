name: Validate calendars

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/*.ics'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'sync-config.json'
      - 'pyproject.toml'
      - '.github/workflows/update-calendar.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: lectio-calendar-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e . pytest
      - name: Test calendar generation and failure recovery
        run: python -m pytest -q
      - name: Validate all committed calendars
        run: python -m lectio_sync.publish --validate docs
      # Existing Pages deployment (main:/docs) serves the same URLs.
      # This workflow no longer accesses Lectio or cookie secrets.
